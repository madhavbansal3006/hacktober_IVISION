# =============================================================================
# Model 1 — LULC Classification — Configuration
# Shiggaon Taluk, Haveri District, Karnataka, India
# =============================================================================
# Edit this file to change study period, paths, or parameters.
# Do not hard-code these values inside the Python modules.

study_area:
  name: "Shiggaon Taluk"
  district: "Haveri"
  state: "Karnataka"
  country: "India"
  # Approximate bounding box (min_lon, min_lat, max_lon, max_lat), WGS84.
  # This is a coarse box used for the initial STAC search / WorldCover clip.
  # The AUTHORITATIVE geometry is the polygon loaded in prepare_study_area.py,
  # not this bbox — the bbox only pre-filters data sources.
  bbox: [75.02, 14.78, 75.45, 15.12]
  # AUTHORITATIVE — user-provided Survey-of-India-derived subdistrict layer
  # (soi_subdistricts.geojson), pre-filtered to Haveri district, TEHSIL ==
  # 'SHIGGAON'. Independently re-verified: area 583.6 km^2 (matches public
  # reference figures of ~584-588 km^2 within 1%), valid geometry, single
  # feature. This is the real boundary, not a proxy. Network download
  # sources below are retained as documented fallbacks only, not currently
  # needed.
  boundary_source_primary:
    description: "LGD subdistrict layer (bharatlas/india-geodata mirror), Shiggaon subdistrict"
    url: "https://bharatlas.com/api/dl/admin/subdistricts/LGD_Subdistricts.parquet"
    filter_field: "subdistrict_name"   # adjust to actual column name once inspected
    filter_value: "Shiggaon"
  # GADM fallback — explicitly NOT authoritative, third-party academic compilation.
  boundary_source_fallback:
    description: "GADM level-3 (taluk), NOT an authoritative government source"
    url: "https://geodata.ucdavis.edu/gadm/gadm4.1/gpkg/gadm41_IND.gpkg"
  local_path: "data/raw/study_area/shiggaon_boundary.gpkg"
  target_crs: "EPSG:32643"   # UTM Zone 43N — appropriate for this longitude, meters-based

sentinel2:
  stac_url: "https://planetarycomputer.microsoft.com/api/stac/v1"
  collection: "sentinel-2-l2a"
  # Dec-Feb is the documented low-cloud window for this part of the Deccan
  # Plateau (monsoon is Jun-Sep). Adjust if the actual search returns nothing
  # in this window.
  date_range: "2025-12-01/2026-02-28"
  max_cloud_cover: 15
  bands:
    blue: "B02"
    green: "B03"
    red: "B04"
    nir: "B08"
    swir: "B11"
  native_resolution_m:
    B02: 10
    B03: 10
    B04: 10
    B08: 10
    B11: 20
  output_resolution_m: 10
  resample_method: "bilinear"   # used to bring B11 20m -> 10m grid
  scl_mask_enabled: true
  # Sentinel-2 Scene Classification (SCL) values to EXCLUDE as bad pixels.
  # 3 = cloud shadow, 8 = cloud medium prob, 9 = cloud high prob,
  # 10 = thin cirrus, 11 = snow/ice, 0 = no data, 1 = saturated/defective
  scl_exclude_values: [0, 1, 3, 8, 9, 10, 11]
  local_path: "data/raw/sentinel2/"

reference_lulc:
  name: "ESA WorldCover 2021 v200"
  vintage_year: 2021
  resolution_m: 10
  license: "CC-BY-4.0"
  # Primary automated access attempt (AWS Open Data). If this is unreachable
  # in the execution environment, the user must manually place the WorldCover
  # GeoTIFF tile(s) covering the Shiggaon bbox into local_path below.
  s3_url_template: "https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_{tile}_Map.tif"
  local_path: "data/raw/reference_lulc/"
  expected_filename_glob: "ESA_WorldCover_10m_2021_v200_*_Map.tif"
  # WorldCover class codes (source: ESA WorldCover product legend)
  source_classes:
    10: "Tree cover"
    20: "Shrubland"
    30: "Grassland"
    40: "Cropland"
    50: "Built-up"
    60: "Bare/sparse vegetation"
    70: "Snow and ice"
    80: "Permanent water bodies"
    90: "Herbaceous wetland"
    95: "Mangroves"
    100: "Moss and lichen"
  # Mapping from WorldCover source classes to our 5 target classes.
  # Ambiguous classes (Grassland=30, Shrubland=20) are EXCLUDED from training
  # by default (strategy A from the data audit) rather than blindly mapped.
  # Flip ambiguous_class_strategy to "map" and fill ambiguous_mapping to use
  # strategy B (documented, visually-verified mapping) instead.
  ambiguous_class_strategy: "exclude"   # "exclude" or "map"
  ambiguous_classes: [20, 30]           # Shrubland, Grassland
  ambiguous_mapping:                     # only used if strategy == "map"
    20: 5   # Shrubland -> Barren (default hypothesis, NOT visually verified)
    30: 5   # Grassland -> Barren (default hypothesis, NOT visually verified)
  class_mapping:                         # WorldCover code -> target class id
    10: 1   # Tree cover -> Forest
    40: 2   # Cropland -> Agriculture
    80: 3   # Permanent water bodies -> Water
    50: 4   # Built-up -> Built-up
    60: 5   # Bare/sparse vegetation -> Barren
    # 90 (Herbaceous wetland), 95 (Mangroves), 100 (Moss/lichen), 70 (Snow/ice)
    # intentionally omitted: not expected in this landlocked Deccan taluk.
    # If present in the clipped raster, those pixels are dropped, not guessed.

target_classes:
  1: "Forest"
  2: "Agriculture"
  3: "Water"
  4: "Built-up"
  5: "Barren"

micro_watersheds:
  # AUTHORITATIVE — user-provided, independently verified against the real
  # Shiggaon boundary: 66 features, 0 invalid/empty geometries, 100%
  # intersect the taluk boundary, total area 966.22 km^2 (recomputed
  # independently in EPSG:32643 and matched to the vendor's own figure).
  # This is the real SLUSI-derived micro-watershed layer — not a proxy,
  # not a download attempt. No fallback download logic is used for this
  # dataset; local_path is the single source of truth.
  local_path: "data/raw/micro_watersheds/shiggaon_micro_watersheds.gpkg"
  id_field: "MWS"          # human-readable micro-watershed code
  id_field_alt: "id"       # internal g_mws.* identifier, also unique
  local_path_fallback: "data/raw/watershed/shiggaon_watersheds.gpkg"  # unused; real data available

features:
  # Order matters: this exact order is written to training_data.csv and
  # must match the order used at prediction time.
  names: ["B2", "B3", "B4", "B8", "B11", "NDVI", "NDWI", "NDBI", "BSI"]
  epsilon: 1.0e-6   # safe-division constant for index formulas

sampling:
  # Target samples per class for training_data.csv. Actual counts may be
  # lower if a class has fewer valid pixels available.
  samples_per_class: 3000
  random_state: 42
  # Spatial block size (meters) used for block-based train/test split to
  # reduce spatial autocorrelation leakage between neighboring pixels.
  spatial_block_size_m: 300
  test_block_fraction: 0.25

random_forest:
  n_estimators: 200
  random_state: 42
  class_weight: "balanced"
  n_jobs: -1
  max_depth: null

paths:
  training_data_csv: "outputs/training_data.csv"
  model_path: "models/lulc_random_forest.joblib"
  model_metadata_path: "models/model_metadata.json"
  prediction_tif: "outputs/lulc_prediction.tif"
  prediction_png: "outputs/lulc_prediction.png"
  micro_watershed_stats_csv: "outputs/micro_watershed_lulc_statistics.csv"
  watershed_stats_csv: "outputs/watershed_lulc_statistics.csv"
  class_statistics_csv: "outputs/class_statistics.csv"
  classification_report_txt: "outputs/classification_report.txt"
  metrics_json: "outputs/accuracy_report.json"
  confusion_matrix_png: "outputs/confusion_matrix.png"
  feature_importance_png: "outputs/feature_importance.png"
  class_distribution_png: "outputs/class_distribution.png"

nodata_value: 0   # 0 is reserved as NoData; class ids are 1-5
